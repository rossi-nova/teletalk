<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>teletalk</title>
<style>
  :root {
    --bg: #ffffff; --bg2: #f4f4f5; --fg: #0f0f0f; --fg2: #707579;
    --line: #e4e4e7; --accent: #3390ec;
    --bubble-self: #eeffde; --bubble-other: #ffffff; --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #212121; --bg2: #181818; --fg: #f4f4f5; --fg2: #aaaaaa;
      --line: #303030; --bubble-self: #2b5278; --bubble-other: #212121;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.45 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg2); color: var(--fg);
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    background: var(--bg); border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .status { font-size: 12px; color: var(--fg2); }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #4caf50; margin-right: 5px; }
  .dot.off { background: #bbb; }
  input[type=text] {
    flex: 1; min-width: 160px; padding: 6px 10px;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg2); color: var(--fg); font-size: 13px;
  }
  button {
    padding: 6px 14px; border: none; border-radius: 8px;
    background: var(--accent); color: #fff; font-size: 13px; cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  main { flex: 1; display: grid; grid-template-columns: 280px 1fr; overflow: hidden; }
  @media (max-width: 720px) { main { grid-template-columns: 1fr; } #sidebar { display: none; } }
  #sidebar { background: var(--bg); border-right: 1px solid var(--line); overflow-y: auto; }
  .dialog { padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; gap: 10px; align-items: center; }
  .dialog:hover, .dialog.active { background: var(--bg2); }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(135deg, #3390ec, #6aa9f0); color: #fff;
    display: grid; place-items: center; font-size: 15px; font-weight: 600; flex: none;
  }
  .dialog .meta { min-width: 0; flex: 1; }
  .dialog .title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dialog .preview { font-size: 12px; color: var(--fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #chat { display: flex; flex-direction: column; overflow: hidden; background: var(--bg2); }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .msg {
    max-width: min(78%, 560px); padding: 7px 11px; border-radius: var(--radius);
    background: var(--bubble-other); align-self: flex-start;
    box-shadow: 0 1px 1px rgba(0,0,0,.06);
    word-break: break-word; white-space: pre-wrap;
  }
  .msg.self { align-self: flex-end; background: var(--bubble-self); }
  .msg .who { font-size: 11px; color: var(--accent); margin-bottom: 2px; font-weight: 500; }
  .msg .time { font-size: 11px; color: var(--fg2); margin-top: 3px; text-align: right; }
  .empty { margin: auto; color: var(--fg2); text-align: center; padding: 40px; }
  #composer { display: flex; gap: 8px; padding: 10px 16px; background: var(--bg); border-top: 1px solid var(--line); }
  #composer input { flex: 1; }
  .badge { font-size: 11px; padding: 2px 7px; border-radius: 10px; background: var(--bg2); color: var(--fg2); }
  .hint { font-size: 12px; color: var(--fg2); }
</style>
</head>
<body>
<header>
  <h1>teletalk</h1>
  <span class="status"><span class="dot off" id="dot"></span><span id="statusText">未连接</span></span>
  <button id="connectBtn">连接钉钉</button>
  <button id="loadBtn" class="ghost">刷新会话</button>
  <span class="badge" id="frameBadge"></span>
  <span class="hint" id="hint"></span>
</header>

<main>
  <aside id="sidebar"></aside>
  <section id="chat">
    <div id="messages"><div class="empty">点「连接钉钉」启动网关会话</div></div>
    <div id="composer">
      <input type="text" id="msgInput" placeholder="输入消息…" disabled>
      <button id="sendBtn" disabled>发送</button>
    </div>
  </section>
</main>

<script>
const API = location.port === '8787' ? '' : 'http://127.0.0.1:8787';
let dialogs = [];
let active = null;
let es = null;
const $ = (id) => document.getElementById(id);

async function refreshStatus() {
  try {
    const r = await fetch(API + '/api/status');
    const s = await r.json();
    $('dot').className = 'dot' + (s.connected ? '' : ' off');
    $('statusText').textContent = s.connected
      ? '已连接' + (s.auth && s.auth.orgId ? ' · 组织 ' + s.auth.orgId : '')
      : '未连接';
  } catch (e) {
    $('dot').className = 'dot off';
    $('statusText').textContent = '网关未启动';
  }
}

async function connect() {
  $('connectBtn').disabled = true;
  $('hint').textContent = '正在抓取凭据并连接…（首次约 10 秒）';
  try {
    const r = await fetch(API + '/api/connect', { method: 'POST' });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || '连接失败');
    $('hint').textContent = '';
    openEvents();
    await loadDialogs();
  } catch (e) {
    $('hint').textContent = e.message.slice(0, 160);
  } finally {
    $('connectBtn').disabled = false;
    refreshStatus();
  }
}

async function loadDialogs() {
  $('loadBtn').disabled = true;
  try {
    const r = await fetch(API + '/api/dialogs');
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    dialogs = d.dialogs || [];
    $('frameBadge').textContent = dialogs.length + ' 会话';
    renderSidebar();
    if (dialogs.length && !active) selectDialog(dialogs[0].id);
  } catch (e) {
    $('frameBadge').textContent = '加载失败';
  } finally {
    $('loadBtn').disabled = false;
  }
}

async function selectDialog(id) {
  active = id;
  renderSidebar();
  const box = $('messages');
  box.innerHTML = '<div class="empty">加载消息…</div>';
  try {
    const r = await fetch(API + '/api/messages/' + encodeURIComponent(id) + '?limit=30');
    const d = await r.json();
    box.innerHTML = '';
    const msgs = d.messages || [];
    if (!msgs.length) {
      box.innerHTML = '<div class="empty">无消息</div>';
    } else {
      for (const m of msgs) appendMsg(box, m);
      box.scrollTop = box.scrollHeight;
    }
  } catch (e) {
    box.innerHTML = '<div class="empty">' + e.message + '</div>';
  }
  updateComposer();
}

/** 选中会话后才允许输入 */
function updateComposer() {
  const ok = !!active;
  $('msgInput').disabled = !ok;
  $('sendBtn').disabled = !ok;
  $('msgInput').placeholder = ok ? '输入消息…' : '先选择一个会话';
}

async function send() {
  const box = $('msgInput');
  const text = box.value.trim();
  if (!active || !text) return;
  $('sendBtn').disabled = true;
  try {
    const r = await fetch(API + '/api/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dialogId: active, text }),
    });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || ('HTTP ' + (d.code ?? '?')));
    box.value = '';
    await selectDialog(active);
  } catch (e) {
    $('hint').textContent = '发送失败：' + e.message;
  } finally {
    $('sendBtn').disabled = false;
  }
}

function appendMsg(box, m) {
  const div = document.createElement('div');
  div.className = 'msg' + (m.self ? ' self' : '');
  const label = m.senderName || (m.senderKey != null ? senderLabel(m.senderKey) : '');
  if (label) {
    const who = document.createElement('div');
    who.className = 'who';
    who.textContent = label;
    if (m.senderKey != null) who.style.color = senderColor(m.senderKey);
    div.appendChild(who);
  }
  const body = document.createElement('div'); body.textContent = m.text; div.appendChild(body);
  const time = document.createElement('div'); time.className = 'time';
  time.textContent = new Date(m.createdAt).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  div.appendChild(time);
  box.appendChild(div);
}

/* 钉钉历史接口不返回发言人姓名，用稳定索引区分 */
const senderNames = new Map();
function senderLabel(key) {
  if (!senderNames.has(key)) senderNames.set(key, '成员 ' + (senderNames.size + 1));
  return senderNames.get(key);
}
function senderColor(key) {
  const hue = (Number(key) * 47) % 360;
  return 'hsl(' + hue + ' 65% 52%)';
}

function renderSidebar() {
  const el = $('sidebar');
  el.innerHTML = '';
  dialogs.forEach(function (d) {
    const div = document.createElement('div');
    div.className = 'dialog' + (active === d.id ? ' active' : '');
    div.onclick = function () { selectDialog(d.id); };
    const av = document.createElement('div'); av.className = 'avatar';
    av.textContent = (d.title || '#').trim().charAt(0).toUpperCase();
    const meta = document.createElement('div'); meta.className = 'meta';
    const t = document.createElement('div'); t.className = 'title'; t.textContent = d.title || d.id;
    const p = document.createElement('div'); p.className = 'preview';
    p.textContent = (d.type === 'group' ? '群聊 · ' : '') + (d.lastMessage ? d.lastMessage.text.slice(0, 30) : d.id);
    meta.appendChild(t); meta.appendChild(p);
    div.appendChild(av); div.appendChild(meta);
    el.appendChild(div);
  });
}

/* SSE：实时消息 + 状态 */
function openEvents() {
  if (es) es.close();
  es = new EventSource(API + '/api/events');
  es.addEventListener('message', (ev) => {
    try {
      const d = JSON.parse(ev.data);
      if (active && d.message && (!d.message.dialogId || d.message.dialogId === active)) {
        appendMsg($('messages'), d.message);
        $('messages').scrollTop = $('messages').scrollHeight;
      }
    } catch (err) { /* 忽略 */ }
  });
  es.addEventListener('status', () => refreshStatus());
}

$('connectBtn').onclick = connect;
$('sendBtn').onclick = send;
$('msgInput').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') send();
});
$('loadBtn').onclick = loadDialogs;
refreshStatus();
setInterval(refreshStatus, 10000);
</script>
</body>
</html>
